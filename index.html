<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高度オームの法則・電力シミュレーター</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        h1 { text-align: center; font-size: 22px; color: #2c3e50; margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 5px; font-weight: bold; color: #34495e; }
        .input-wrapper { display: flex; }
        .input-wrapper input { flex: 1; padding: 10px; border: 2px solid #ddd; border-radius: 6px; font-size: 16px; }
        .unit { margin-left: 10px; font-weight: bold; width: 40px; line-height: 40px; color: #555; }
        
        /* 拡張：グラフィカル回路図のCSS */
        .circuit-board {
            position: relative;
            width: 100%;
            height: 160px;
            background: #2c3e50;
            border-radius: 8px;
            margin: 20px 0;
            overflow: hidden;
            border: 3px solid #34495e;
        }
        /* 回路の配線（四角いループ） */
        .wire-loop {
            position: absolute;
            top: 30px; left: 50px; right: 50px; bottom: 30px;
            border: 4px solid #7f8c8d;
            border-radius: 4px;
        }
        /* コンポーネント共通 */
        .component {
            position: absolute;
            background: #34495e;
            color: #fff;
            padding: 6px 10px;
            font-family: monospace;
            font-size: 12px;
            border-radius: 4px;
            border: 2px solid #bdc3c7;
            text-align: center;
            z-index: 2;
        }
        #wire-battery { top: 50px; left: 15px; }       /* 左側：電源 */
        #wire-resistor { top: 50px; right: 15px; }     /* 右側：抵抗 */
        #wire-ammeter { bottom: 10px; left: 40%; }     /* 下側：電流計イメージ */

        /* 電子の流れアニメーション（配線上の光） */
        .electron {
            position: absolute;
            width: 8px; height: 8px;
            background: #f1c40f;
            border-radius: 50%;
            box-shadow: 0 0 8px #f1c40f;
            z-index: 1;
            display: none; /* 電流が流れたら表示 */
        }

        /* 測定データ出力エリア */
        .display-panel { padding: 15px; background: #ecf0f1; border-radius: 8px; border-left: 5px solid #2980b9; }
        .data-row { font-family: monospace; font-size: 15px; margin-bottom: 5px; }
        .msg-box { font-size: 13px; color: #27ae60; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>オームの法則 & 電力シミュレーター</h1>
    
    <div class="input-group">
        <label for="voltage">電圧 (V)</label>
        <div class="input-wrapper">
            <input type="number" id="voltage" step="any" placeholder="例: 5">
            <span class="unit">V</span>
        </div>
    </div>

    <div class="input-group">
        <label for="current">電流 (I)</label>
        <div class="input-wrapper">
            <input type="number" id="current" step="any" placeholder="例: 0.02">
            <span class="unit">A</span>
        </div>
    </div>

    <div class="input-group">
        <label for="resistance">抵抗 (R)</label>
        <div class="input-wrapper">
            <input type="number" id="resistance" step="any" placeholder="例: 250">
            <span class="unit">Ω</span>
        </div>
    </div>

    <div class="circuit-board">
        <div class="wire-loop"></div>
        <div class="component" id="wire-battery">電源<br><span id="gui-v">-- V</span></div>
        <div class="component" id="wire-resistor">抵抗<br><span id="gui-r">-- Ω</span></div>
        <div class="component" id="wire-ammeter">電流: <span id="gui-i">-- A</span></div>
        <div class="electron" id="electron-dot"></div>
    </div>

    <div class="display-panel">
        <div class="data-row">⚡ 電圧 (V): <span id="out-v">--</span> V</div>
        <div class="data-row">🏃 電流 (I): <span id="out-i">--</span> A</div>
        <div class="data-row">🚧 抵抗 (R): <span id="out-r">--</span> Ω</div>
        <div class="data-row" style="color: #e67e22; font-weight: bold; border-top: 1px dashed #ccc; padding-top: 5px; margin-top: 5px;">
            🔥 消費電力 (P): <span id="out-p">--</span> W
        </div>
        <div class="msg-box" id="msgBox"></div>
    </div>
</div>

<script type="module" src="main.js"></script>
</body>
</html>
